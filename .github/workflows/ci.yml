# CI for SafeMe — builds, signs and tests on every push.
#
# Release signing is fed from GitHub repository secrets (never committed):
#   KEYSTORE_BASE64   — base64 of the release .jks keystore
#   KEYSTORE_PASSWORD — keystore password
#   KEY_ALIAS         — signing key alias (default `safeme`)
#   KEY_PASSWORD      — key password
# When the secrets are absent (e.g. forks), assembleRelease falls back to the
# app's documented unsigned output and the workflow still passes.
#
# `lintDebug` runs against `app/lint-baseline.xml`, which records the single
# documented ProtectedPermissions finding (ADB-only WRITE_SECURE_SETTINGS
# grant). New findings fail the build.
#
# The build job runs a two-leg matrix: `normal` signs when the repository
# secrets exist; `fork-simulation` forces the secrets-absent path so the
# unsigned fallback (the fork scenario) is exercised on every run.

name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify wrapper JAR checksum
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build, sign & test (${{ matrix.leg }})
    needs: validate-wrapper
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: normal
            force_fork_sim: false
          - leg: fork-simulation
            force_fork_sim: true
    env:
      # Secrets are dereferenced at job level because the `secrets` context is
      # not valid in step-level `if` conditions; steps gate on `env` instead.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25 (build targets release 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # The action's built-in license acceptance is not reliable on the current
      # runner image: it finds cmdline-tools 12.0 preinstalled, downloads build
      # 12266719 (-> cmdline-tools/16.0) and then its own
      # `sdkmanager --licenses` leaves "7 of 8 SDK package licenses not
      # accepted" and exits 1, failing the job before any build step runs.
      # Licenses are accepted deterministically in the next step instead.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      # Answering the prompts from a finite input (rather than `yes |`, which
      # raises SIGPIPE under `set -o pipefail` when sdkmanager exits) makes the
      # acceptance repeatable. Install the components afterwards so the
      # versions stay pinned in one place.
      - name: Accept SDK licenses and install components
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 1 200) | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure release signing from secrets
        if: ${{ !matrix.force_fork_sim && env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Release signing secrets are incomplete: ${var} is empty. Configure all four secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) under Settings -> Secrets and variables -> Actions, or leave KEYSTORE_BASE64 unset to build unsigned." >&2
              exit 1
            fi
          done
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/safeme-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/safeme-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing configured from GitHub secrets."

      - name: Verify bundled-dataset counts match sources
        run: python3 tools/ci/check_bundled_counts.py --check

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Android lint (baseline covers known findings)
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build release APK (signed when secrets configured)
        run: ./gradlew :app:assembleRelease

      - name: Verify release APK is signed (secrets configured)
        if: ${{ !matrix.force_fork_sim && env.KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No release APK produced." >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          echo "Signed release APK verified: $apk"

      - name: Verify unsigned fallback (fork-simulation leg)
        if: ${{ matrix.force_fork_sim }}
        run: |
          set -euo pipefail
          if [ -f keystore.properties ]; then
            echo "::error::Fork simulation produced keystore.properties; the unsigned fallback was not exercised." >&2
            exit 1
          fi
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::Fork simulation produced no release APK." >&2
            exit 1
          fi
          echo "Fork simulation OK: unsigned release APK at $apk (no keystore.properties)."

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: safeme-apks-${{ matrix.leg }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  # Manual release job: a human-triggered (workflow_dispatch) build that turns
  # the repository secrets into a signed release APK and uploads it, so
  # releases don't depend on a local machine or keystore. Runs only on the
  # default branch; refuses to upload anything not signed with the SafeMe
  # release key (fingerprint pinned below — see artifacts/release-signing.md).
  release-signing:
    name: Build signed release APK (manual)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate-wrapper
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Certificate SHA-256 digest of the SafeMe release key (public, not a
      # secret). The job fails rather than upload an artifact signed by any
      # other key, which would be silently uninstallable over real releases.
      EXPECTED_CERT_SHA256: 7635cda60fc38031613ef22ffb26674a5d0d6e01196bc8e32210e2b505399016
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25 (build targets release 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # The action's built-in license acceptance is not reliable on the current
      # runner image: it finds cmdline-tools 12.0 preinstalled, downloads build
      # 12266719 (-> cmdline-tools/16.0) and then its own
      # `sdkmanager --licenses` leaves "7 of 8 SDK package licenses not
      # accepted" and exits 1, failing the job before any build step runs.
      # Licenses are accepted deterministically in the next step instead.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      # Answering the prompts from a finite input (rather than `yes |`, which
      # raises SIGPIPE under `set -o pipefail` when sdkmanager exits) makes the
      # acceptance repeatable. Install the components afterwards so the
      # versions stay pinned in one place.
      - name: Accept SDK licenses and install components
        run: |
          set -euo pipefail
          printf 'y\n%.0s' $(seq 1 200) | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure release signing from secrets
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Release signing secrets are incomplete: ${var} is empty. Configure all four secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) under Settings -> Secrets and variables -> Actions, then re-run this workflow." >&2
              exit 1
            fi
          done
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/safeme-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/safeme-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing configured from GitHub secrets."

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify signature and key fingerprint
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No release APK produced." >&2
            exit 1
          fi
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          echo "$certs"
          digest=$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -z "$digest" ]; then
            echo "::error::Could not read certificate SHA-256 digest from apksigner output." >&2
            exit 1
          fi
          if [ "$digest" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with an unexpected key. Got $digest, expected $EXPECTED_CERT_SHA256. Check the KEYSTORE_BASE64 secret; refusing to upload." >&2
            exit 1
          fi
          echo "Signature verified with the SafeMe release key ($digest)."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: safeme-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
